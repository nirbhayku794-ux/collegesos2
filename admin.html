<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>🛡️ CampusSOS Admin</h1>

    <p>Emergency Response Dashboard</p>

</header>

<main>

    <div class="stats">

        <div class="stat">
            <h2 id="total">0</h2>
            <p>Total</p>
        </div>

        <div class="stat">
            <h2 id="active">0</h2>
            <p>Active</p>
        </div>

        <div class="stat">
            <h2 id="resolved">0</h2>
            <p>Resolved</p>
        </div>

    </div>

    <div id="emergencyList"></div>

</main>

<script src="app.js"></script>

</body>

</html>
